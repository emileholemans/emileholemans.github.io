    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        // Night unless the visitor pressed the day button; the system setting is not followed.
        if (t !== "light" && t !== "dark") t = "dark";
        var r = document.documentElement;
        r.dataset.theme = t;
        r.style.colorScheme = t;
        r.classList.toggle("dark", t === "dark");
        if (t === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f7f5f1");
      })();
